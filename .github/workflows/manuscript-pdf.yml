name: Manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - ".github/workflows/manuscript-pdf.yml"
  pull_request:
    paths:
      - "manuscript/**"
      - ".github/workflows/manuscript-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript-pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: main.tex
          working_directory: manuscript
          compiler: latexmk
          texlive_version: 2026

      - name: Upload PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: manuscript/main.pdf
          if-no-files-found: error
          retention-days: 30
          archive: false

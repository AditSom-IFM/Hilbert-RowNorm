[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hilbert-rownorm"
version = "0.1.0"
description = "Lean PyTorch pretraining harness for LM-head optimizer experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.13,<2.14",
  "wandb>=0.28.2,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.16,<0.17",
]
plots = [
  "matplotlib>=3.10,<3.11",
]

[project.scripts]
hilbert-rownorm-train = "hilbert_rownorm.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
